<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>

    /* 只给这个盒子设置居中样式，不影响任何其他元素 */
    .center-box {
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* 让盒子占满整个屏幕，实现全屏居中 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    iframe#__tauri_isolation__ {
      display: none !important;
    }

    h1 {
      color: #333;
    }
  </style>
</head>
<body>

  <!-- 只有这里面的内容会居中 -->
  <div class="center-box">
    <h1>Hello World</h1>
  </div>

</body>
</html>
